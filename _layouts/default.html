<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="bingbot" content="index, follow" />
  <meta name="author" content="{{ site.author }}" />
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.65; color: #212529; background: #f8f9fa; }
    header.archive-header { border-bottom: 2px solid #0d6efd; padding-bottom: .75rem; margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
    header.archive-header a { color: #0d6efd; text-decoration: none; font-weight: 600; font-size: 1rem; }
    header.archive-header a:hover { text-decoration: underline; }
    nav.archive-nav { font-size: .9rem; }
    nav.archive-nav a { margin-left: 1rem; color: #495057; font-weight: 500; }
    nav.archive-nav a:hover { color: #0d6efd; }
    main img { max-width: 100%; height: auto; }
    main table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .92rem; }
    main th, main td { border: 1px solid #dee2e6; padding: .5rem .75rem; text-align: left; vertical-align: top; }
    main th { background: #e9ecef; }
    main blockquote { border-left: 4px solid #0d6efd; margin: 1rem 0; padding: .5rem 1rem; background: #e9ecef; }
    main code { background: #e9ecef; padding: .15rem .35rem; border-radius: 3px; font-size: .9em; }
    main pre { background: #e9ecef; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    main pre code { background: none; padding: 0; }
    footer.archive-footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #dee2e6; font-size: .85rem; color: #6c757d; text-align: center; }
    footer.archive-footer a { color: #0d6efd; }
  </style>
    <!-- ===== PHASE B: WebSite JSON-LD (sitelinks / site name eligibility) ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "{{ site.url }}{{ site.baseurl }}/#website",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "name": "Pravinkumar Ghodake Academic Archive",
    "description": "{{ site.description | escape }}",
    "publisher": {
      "@type": "Person",
      "@id": "{{ site.url }}{{ site.baseurl }}/#person",
      "name": "{{ site.author | escape }}",
      "url": "{{ site.url }}{{ site.baseurl }}/"
    },
    "inLanguage": "en"
  }
  </script>

  <!-- ===== PHASE B: BreadcrumbList JSON-LD (breadcrumb rich result eligibility) ===== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "{{ site.url }}{{ site.baseurl }}/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Public Records",
        "item": "{{ site.url }}{{ site.baseurl }}/01-public-records/"
      },
      {
        "@type": "ListItem",
        "position": 3,
        "name": "{{ page.title | split: ' — ' | first | escape }}",
        "item": "{{ site.url }}{{ site.baseurl }}{{ page.url }}"
      }
    ]
  }
  </script>
</head>
</head>
<body>
  <header class="archive-header">
    <a href="{{ site.baseurl }}/">← {{ site.author }}</a>
    <nav class="archive-nav">
      <a href="{{ site.baseurl }}/01-public-records/">Public Records</a>
      <a href="{{ site.baseurl }}/">Home</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="archive-footer">
    <p>© 2026 {{ site.author }} · <a href="https://orcid.org/0000-0002-6755-4003">ORCID 0000-0002-6755-4003</a></p>
    <p>Licensed under CC BY 4.0 · <a href="{{ site.baseurl }}/">Archive Home</a></p>
  </footer>
</body>
</html>
